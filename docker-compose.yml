services:
  db:
    image: postgres:16
    container_name: six-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sixdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: six-backend
    command:  npm run start:dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
      - "5555:5555"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@six-db:5432/sixdb"
    restart: always
  frontend:
    build: ./frontend
    container_name: six-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
volumes:
  db_data:
